on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: Style

permissions: read-all

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install styler
        run: install.packages("styler")
        shell: Rscript {0}

      - name: Check style
        run: |
          out <- styler::style_pkg(dry = "on")
          if (nrow(out[out$changed, ]) > 0) {
            cat("Files with style issues:\n")
            print(out[out$changed, ])
            stop("Style issues found. Run styler::style_pkg() locally.")
          }
        shell: Rscript {0}
