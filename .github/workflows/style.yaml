on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: Style

permissions: read-all

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::styler
          needs: styler

      - name: Check style
        run: |
          out <- styler::style_pkg(dry = "on")
          if (any(out$changed, na.rm = TRUE)) {
            cat("Files with style issues:\n")
            print(out[out$changed %in% TRUE, ])
            stop("Style issues found. Run styler::style_pkg() locally.")
          }
        shell: Rscript {0}
